[package]
name = "starwhisper"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = true
strip = true

[dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.3+spec-1.1.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
chrono = { version = "0.4.45", features = ["serde"] }
tokio-cron-scheduler = "0.15.1"
frankenstein = { version = "0.50.2", features = ["client-reqwest"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
tiktoken-rs = "0.12.0"
thiserror = "2.0.19"

[dev-dependencies]
tokio-test = "0.4.5"
